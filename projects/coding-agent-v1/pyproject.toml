[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-v1"
version = "0.1.0"
description = "Scaffold for a local repo-aware coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coding-agent-v1 = "coding_agent_v1.cli:main"
coding-agent-v1-model-planner-adapter = "coding_agent_v1.model_planner_adapter:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
